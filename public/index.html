<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dialogues Knowledge Base</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #eee; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 20px 24px; border-bottom: 1px solid #222; }
    header h1 { font-size: 1.2rem; font-weight: 600; color: #fff; }
    header p { font-size: 0.8rem; color: #666; margin-top: 2px; }
    #chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 0.9rem; }
    .user { background: #1a1a2e; align-self: flex-end; color: #a0c4ff; }
    .assistant { background: #1a1a1a; align-self: flex-start; color: #eee; border: 1px solid #222; }
    .thinking { color: #555; font-style: italic; }
    #input-area { padding: 16px 24px; border-top: 1px solid #222; display: flex; gap: 12px; }
    #question { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #eee; padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; outline: none; }
    #question:focus { border-color: #555; }
    #send { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
    #send:hover { background: #1d4ed8; }
    #send:disabled { background: #333; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Dialogues Knowledge Base</h1>
    <p>Ask anything about the podcast episodes</p>
  </header>
  <div id="chat"></div>
  <div id="input-area">
    <input id="question" type="text" placeholder="Ask a question about the podcast..." />
    <button id="send">Ask</button>
  </div>
  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('question');
    const btn = document.getElementById('send');

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendQuestion() {
      const question = input.value.trim();
      if (!question) return;

      input.value = '';
      btn.disabled = true;
      addMessage(question, 'user');
      const thinking = addMessage('Thinking...', 'assistant thinking');

      try {
        const res = await fetch('http://localhost:3000/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        thinking.textContent = data.answer;
        thinking.className = 'message assistant';
      } catch (err) {
        thinking.textContent = 'Error connecting to server.';
      }

      btn.disabled = false;
      input.focus();
    }

    btn.addEventListener('click', sendQuestion);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') sendQuestion(); });
  </script>
</body>
</html>
